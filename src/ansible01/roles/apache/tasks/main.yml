---
- name: apt update
  become: yes
  apt:
    update_cache: yes

- name: Install Apache
  become: yes
  apt:
    name: apache2
    state: present

- name: Start Apache service
  become: yes
  service:
    name: apache2
    state: started
    enabled: yes

- name: Create a simple HTML page
  become: yes
  copy:
    content: "<h1>Apache Server is Running</h1>"
    dest: /var/www/html/index.html

