---
- name: Install necessary packages for Consul and Envoy
  apt:
    name:
      - wget
      - unzip
      - curl
      - tor  # hashicorp has banned downloads from Russia, in order to bypass it we will use TOR
      - proxychains
    state: present
    update_cache: true

- name: start tor
  service: 
    name: tor
    state: started

- name: Download Consul ZIP file using proxychains & tor to download consul
  command: 
    proxychains curl -Lo /tmp/consul.zip https://releases.hashicorp.com/consul/1.20.2/consul_1.20.2_linux_amd64.zip
  args:
    creates: /tmp/consul.zip  # This prevents re-downloading if the file already exists

- name: Unzip Consul
  unarchive:
    src: /tmp/consul.zip
    dest: /usr/local/bin/
    remote_src: yes

- name: Download Envoy binary from GitHub
  get_url:
    url: https://github.com/envoyproxy/envoy/releases/download/v1.32.3/envoy-contrib-1.32.3-linux-x86_64
    dest: /usr/local/bin/envoy
    mode: '0755'

- name: Create directories for Consul
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /opt/consul
    - /opt/consul/data
    - /etc/consul.d
    - /etc/consul.d/certs

- name: Copy Consul configuration file
  template:
    src: /vagrant/src/consul01/consul_client.hcl
    dest: /etc/consul.d/consul.hcl
    force: yes  # This will replace the file if it already exists

- name: Copy Consul certificates
  copy:
    src: /vagrant/src/consul01/certs/
    dest: /etc/consul.d/certs/


- name: Set service_name for Consul Envoy Sidecar
  set_fact:
   service_name: "{{ 'postgres' if ansible_hostname == 'db' else 'hotel-service' }}"

- name: Create Consul systemd service
  copy:
   content: |
     [Unit]
     Description=Consul Client Service
     After=network.target

     [Service]
     ExecStart=/usr/local/bin/consul agent -config-dir=/etc/consul.d
     Restart=on-failure

     [Install]
     WantedBy=multi-user.target
   dest: /etc/systemd/system/consul.service
   mode: '0644'

- name: Create Envoy sidecar systemd service
  copy:
   dest: /etc/systemd/system/consul-envoy.service
   content: |
       [Unit]
       Description=Consul Envoy Sidecar for {{ service_name }}
       After=network.target consul.service

       [Service]
       ExecStart=/usr/local/bin/consul connect envoy -sidecar-for {{ service_name }} -ignore-envoy-compatibility 
       Restart=on-failure
       User=root
       LimitNOFILE=65536

       [Install]
       WantedBy=multi-user.target
   mode: '0644'

- name: Reload systemd manager configuration
  command: systemctl daemon-reload

- name: Start consul service
  service:
    name: consul
    state: started
    enabled: true

- name: Start envoy service
  service:
    name: consul-envoy
    state: started
    enabled: true
